services:
  - type: web
    name: poc-dxc-parking
    env: node
    plan: free
    buildCommand: npm install --ignore-scripts --include=dev && npx vite build apps/web
    startCommand: node mock-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: APP_URL
        value: https://poc-dxc-parking.onrender.com
      # Jeton d'appel de l'API agent (/api/agent/*), utilisé par Dust.
      # Render génère une valeur forte ; à copier depuis le dashboard vers Dust.
      - key: AGENT_API_TOKEN
        generateValue: true
      # Credentials d'envoi de mail via noreplyrise@rise.fo (Microsoft Graph).
      # Fournit MAIL_TENANT_ID / MAIL_CLIENT_ID / MAIL_CLIENT_SECRET / MAIL_SENDER.
      - fromGroup: noreplyrise-mail
